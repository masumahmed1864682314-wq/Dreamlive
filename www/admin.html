<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DreamLive Admin</title><style>body{font-family:Arial,sans-serif;background:#07110d;color:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:30px 16px}.card{background:#0d1d15;border:1px solid #1a3324;border-radius:16px;padding:20px;margin-bottom:16px}input,button{padding:11px;border-radius:9px;border:1px solid #284b35;background:#0a160f;color:#fff}button{cursor:pointer}.row{display:grid;grid-template-columns:1fr auto;gap:10px}.muted{color:#9fb2a5}.ok{color:#86efac}.bad{color:#fca5a5}</style></head><body><div class="wrap"><div class="card"><h1>🛠 DreamLive Admin</h1><p class="muted">Use this page to verify providers, cache state and API connectivity.</p><div class="row"><input id="token" type="password" placeholder="ADMIN_UPLOAD_TOKEN"><button onclick="loadStatus()">Check status</button></div><pre id="out" style="white-space:pre-wrap"></pre></div><div class="card"><h2>API tools</h2><button onclick="test('/api/live')">Test Live</button><button onclick="test('/api/today')">Test Today</button><button onclick="test('/api/upcoming')">Test Upcoming</button></div></div><script>async function loadStatus(){const r=await fetch('/api/status');document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}async function test(u){const r=await fetch(u);document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}loadStatus()</script></body></html>
